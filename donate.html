<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>星燃_X-starRelight · 赞助支持</title>
    <!-- Font Awesome 7.2.0 ( Free ) -->
    <link rel="stylesheet" href="/package/font-awesome/code/css/all.min.css">
    <!-- GSAP 核心库 + ScrollTrigger 插件 -->
    <script src="/package/GSAP/code/gsap.min.js"></script>
    <script src="/package/GSAP/code/ScrollTrigger.min.js"></script>
    <!-- Vue.js -->
    <script src="/package/Vue/code/vue.global.prod.js"></script>
    <script src="/package/Marked/code/marked.umd.js"></script>

    <!-- 动态加载外部资源（原有逻辑） -->
    <script>
      function loadStyle(src) {
        return new Promise((resolve, reject) => {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = src + "?v=" + new Date().getTime();
          link.async = true;
          link.onload = resolve;
          link.onerror = reject;
          document.head.appendChild(link);
        });
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          if (src.includes('?')) {
            script.src = src + "&v=" + new Date().getTime();
          } else {
            script.src = src + "?v=" + new Date().getTime();
          }
          script.async = true;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      const quicksJson = JSON.stringify([
          { "name": "首页", "link": "/#home" },
          { "name": "关于我们", "link": "/#about" },
          { "name": "项目展示", "link": "/#studio" },
          { "name": "团队成员", "link": "/#contact" },
          { "name": "捐赠", "link": "/donate.html" },
      ]);

      const encodedQuicks = encodeURIComponent(quicksJson);
      const text = encodeURIComponent("星燃_X-starRelight");

      loadStyle("../assets/style.css");
      let scriptArray = [
        "/assets/AddHeader.js",
        `https://footerjs-sxxyrry.pages.dev/footer.js?name=${text}&description=${text}&quicks=${encodedQuicks}`,
        "/assets/AutoRun.js",
        "/assets/pointer.js",
      ];

      scriptArray.forEach((script) => {
        loadScript(script);
      });
    </script>

    <!-- 样式（原有，保留） -->
    <link rel="stylesheet" href="/assets/style.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 继承原网页的视觉风格 — 深色主题 + 橙色强调色 */
        :root {
            --bg-dark: #0a0c10;
            --bg-card: #14171c;
            --bg-elevated: #1e2128;
            --border-dim: #2a2e36;
            --text-primary: #f0f3fa;
            --text-secondary: #b0b8c5;
            --accent: #f97316;
            --accent-hover: #fd9b4a;
            --accent-glow: rgba(249, 115, 22, 0.2);
        }

        .container {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
        }

        /* 卡片样式 — 与原网页 card 风格一致 */
        .donation-card {
            background: var(--bg-card);
            border-radius: 2rem;
            border: 1px solid var(--border-dim);
            padding: 2rem 1.8rem 2.2rem;
            backdrop-filter: blur(2px);
            transition: transform 0.2s ease, border-color 0.2s;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
        }

        .donation-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        /* 装饰性小徽章 */
        .support-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(249, 115, 22, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--accent);
            border: 1px solid rgba(249, 115, 22, 0.25);
            margin-bottom: 1.5rem;
        }

        .support-badge i {
            font-size: 0.9rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #facc15, #f97316);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .subhead {
            color: var(--text-secondary);
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
            border-left: 3px solid var(--accent);
            padding-left: 0.9rem;
        }

        /* 二维码展示区域 */
        .qrcode-wrapper {
            display: flex;
            justify-content: center;
            margin: 1.2rem 0 1rem;
        }

        .qrcode-img {
            background: rgb(68, 71, 73);
            padding: 0.75rem;
            border-radius: 28px;
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
            max-width: 100%;
            width: 280px;
            height: auto;
            display: block;
            cursor: pointer;
        }

        .qrcode-img:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 35px -8px var(--accent-glow);
        }

        /* 提示文字 + 小额赞助说明 */
        .donation-note {
            background: var(--bg-elevated);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            margin: 1.2rem 0 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            border: 1px solid var(--border-dim);
        }

        .donation-note i {
            color: var(--accent);
            margin-right: 6px;
        }

        .method-icons {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin: 1rem 0 1.5rem;
        }

        .method-icons span {
            background: var(--bg-card);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-dim);
            color: var(--text-secondary);
        }

        .method-icons i {
            color: var(--accent);
        }

        /* 按钮组 */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: 1.5px solid var(--accent);
            color: var(--accent);
            padding: 0.65rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #0a0c10;
            border: none;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px var(--accent-glow);
        }

        .btn-outline:hover {
            background: var(--accent);
            color: #0a0c10;
            border-color: var(--accent);
        }

        /* 其他支持方式 (爱发电等, 与原网页呼应) */
        .alt-support {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-dim);
            padding-top: 1.4rem;
        }

        .alt-support a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .alt-support a:hover {
            text-decoration: underline;
            color: var(--accent-hover);
        }

        /* 返回主页的小提示 */
        .back-home {
            text-align: center;
            margin-top: 2rem;
        }

        .back-home a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-home a:hover {
            color: var(--accent);
        }

        /* 简单响应式微调 */
        @media (max-width: 480px) {
            .donation-card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.7rem;
            }
            .qrcode-img {
                width: 240px;
            }
            .method-icons span {
                font-size: 0.7rem;
                padding: 0.2rem 0.8rem;
            }
        }

        /* 图片点击放大简单预览 (轻交互) */
        .img-preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0s linear 0.2s;
        }
        .img-preview-overlay.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.2s;
        }
        .preview-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 28px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.5);
            background: white;
            padding: 12px;
        }
    </style>
</head>
<body>

<br><br><br><br>

<div class="container">
    <div class="donation-card _target">
        <!-- 装饰 badge -->
        <div class="support-badge _target">
            <i class="fas fa-heart"></i> 用热爱发电 · 感谢陪伴
        </div>

        <h1 class="_target">
            <i class="fas fa-qrcode" style="font-size: 1.8rem; color: var(--accent); margin-right: 6px;"></i>
            赞助支持
        </h1>
        <div class="subhead _target">
            您的每一份鼓励，都会让星辰更亮 · 让代码更有温度
        </div>

        <!-- 捐赠二维码区域 -->
        <div class="qrcode-wrapper _target">
            <img src="./assets/donate.png" 
                 alt="微信捐赠二维码" 
                 class="qrcode-img"
                 id="donateQrImg"
                 title="点击可放大查看">
        </div>

        <!-- 提示说明 -->
        <div class="donation-note _target">
            <i class="fas fa-camera"></i> 长按或扫码即可赞助 · 所有款项将用于开源项目及创作激励等
        </div>

        <!-- 支持方式标识 (兼容微信/支付宝) -->
        <div class="method-icons">
            <span class="_target"><i class="fab fa-weixin"></i> 微信支付</span>
        </div>

        <!-- 操作按钮区 -->
        <div class="action-buttons">
            <a href="/index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> 返回主页
            </a>
            <button class="btn btn-outline" id="copyThanksBtn">
                <i class="fas fa-copy"></i> 复制感谢语
            </button>
        </div>

        <!-- 其他支持渠道 (爱发电等，与原网站风格衔接) -->
        <div class="alt-support _target">
            <i class="fas fa-gift"></i> 其他支持方式：
            <a href="https://ifdian.net/a/sxxyrry_ttxr" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-bolt"></i> 爱发电赞助
            </a>
            <!-- &nbsp;|&nbsp;
            <a href="https://github.com/sxxyrry" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github"></i> GitHub 赞助
            </a> -->
        </div>
    </div>

    <div class="back-home">
        <a href="/index.html">
            <i class="fas fa-arrow-left"></i> 回到「星燃_X-starRelight」个人主页
        </a>
    </div>
</div>

<!-- 轻量图片放大预览层 -->
<div id="imgPreviewOverlay" class="img-preview-overlay">
    <img id="previewImage" class="preview-img" alt="捐赠二维码大图">
</div>

<script>
    (function() {
        // 1. 二维码点击放大功能 (轻交互，提升体验)
        const qrImg = document.getElementById('donateQrImg');
        const overlay = document.getElementById('imgPreviewOverlay');
        const previewImg = document.getElementById('previewImage');

        if (qrImg && overlay && previewImg) {
            // 点击二维码打开大图预览
            qrImg.addEventListener('click', function(e) {
                e.stopPropagation();
                previewImg.src = qrImg.src;
                overlay.classList.add('active');
            });
            // 点击遮罩层关闭预览
            overlay.addEventListener('click', function() {
                overlay.classList.remove('active');
            });
            // 防止点击图片时冒泡关闭
            previewImg.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }

        // 2. 复制感谢语按钮（增加捐赠页面的温情互动）
        const copyBtn = document.getElementById('copyThanksBtn');
        if (copyBtn) {
            copyBtn.addEventListener('click', async function() {
                const thanksText = `✨ 感谢您的慷慨支持！✨\n\n每一份赞助都会化作星辰与代码之间的光，让「星燃_X-starRelight」以及 TT23XR 工作室能够持续创作更多有趣的项目。\n\n愿技术与你同行，热爱永不熄灭。❤️\n\n—— 星燃_X-starRelight 敬上`;
                try {
                    await navigator.clipboard.writeText(thanksText);
                    // 临时改变按钮文字反馈
                    const originalHtml = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制感谢语';
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHtml;
                    }, 1800);
                } catch (err) {
                    // 降级方案
                    const textarea = document.createElement('textarea');
                    textarea.value = thanksText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    const originalHtml = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHtml;
                    }, 1800);
                }
            });
        }

        // 3. 优雅处理图片加载失败的情况 (给用户友好提示)
        if (qrImg) {
            qrImg.addEventListener('error', function() {
                this.alt = '捐赠码加载失败，请检查 ./assets/donate.png 路径或联系站长';
                this.style.opacity = '0.7';
                this.style.border = '1px dashed var(--accent)';
                // 在图片下方显示文字提示（如果可能）
                const wrapper = this.closest('.qrcode-wrapper');
                if (wrapper && !wrapper.querySelector('.error-tip')) {
                    const errTip = document.createElement('div');
                    errTip.className = 'error-tip';
                    errTip.style.marginTop = '12px';
                    errTip.style.fontSize = '0.8rem';
                    errTip.style.color = '#f97316';
                    errTip.style.backgroundColor = 'rgba(249,115,22,0.1)';
                    errTip.style.padding = '6px 12px';
                    errTip.style.borderRadius = '40px';
                    errTip.innerHTML = '<i class="fas fa-exclamation-triangle"></i> 暂未找到捐赠码图片，请确保 ./assets/donate.png 存在';
                    wrapper.appendChild(errTip);
                }
            });
        }

        // 额外小细节：鼠标悬浮二维码时显示“点击放大”提示
        if (qrImg) {
            qrImg.title = "点击放大二维码，扫码赞助";
        }
    })();
</script>

<!-- 注：捐赠页面完全独立，不依赖原网页的任何复杂脚本（GSAP/Vue等），只保留相同的设计语言。
     图片路径为 ./assets/donate.png ，与题目要求完全一致。
     页面包含“返回主页”按钮，以及爱发电/GitHub 等备选支持渠道，与原网页价值观统一。 -->
</body>
